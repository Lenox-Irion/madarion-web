<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>madarion.io</title>
  <meta name="description" content="madarion.io">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Plex Sans";
      src: url("/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Plex Sans";
      src: url("/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Plex Mono";
      src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #737373;
      --line: #e8e8e8;
      --sans: "Plex Sans", system-ui, sans-serif;
      --mono: "Plex Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0c;
        --fg: #f2f2f2;
        --muted: #8c8c8c;
        --line: #232323;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 40px);
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-weight: 500;
      font-size: clamp(48px, 11vw, 168px);
      line-height: 1;
      letter-spacing: -0.045em;
      margin-left: -0.05em;
    }

    dl {
      display: grid;
      grid-template-columns: 96px 1fr;
      row-gap: 10px;
      margin-top: clamp(24px, 5vh, 56px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
      max-width: 480px;
      font-size: 15px;
    }

    dt {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 22px;
      color: var(--muted);
    }

    dd { line-height: 22px; }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 4px;
      transition: text-decoration-color 0.15s;
    }
    a:hover { text-decoration-color: currentColor; }

    /* Background dot field */
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .page { position: relative; }

    /* Name: letters rise in, lift on hover */
    h1 { overflow: hidden; padding: 0.04em 0; cursor: default; }
    h1 .ch {
      display: inline-block;
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      animation-delay: calc(var(--i) * 45ms + 150ms);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    h1 .ch:hover { transform: translateY(-0.1em); }
    @keyframes rise { from { transform: translateY(105%); } }

    /* Rule draws in, rows follow */
    dl { border-top: 0; position: relative; }
    dl::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: var(--fg);
      opacity: 0.12;
      transform-origin: left;
      animation: draw 1s cubic-bezier(0.6, 0, 0.2, 1) 0.6s backwards;
    }
    @keyframes draw { from { transform: scaleX(0); } }
    dt, dd { animation: fade 0.6s ease-out backwards; }
    dt:nth-of-type(1), dd:nth-of-type(1) { animation-delay: 1.0s; }
    dt:nth-of-type(2), dd:nth-of-type(2) { animation-delay: 1.12s; }
    header, footer { animation: fade 0.8s ease-out 0.1s backwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

    .pulse {
      display: inline-block;
      width: 7px; height: 7px;
      margin-right: 10px;
      vertical-align: 1px;
      background: var(--fg);
      animation: blink 1.6s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0.15; } }

    .clock { font-variant-numeric: tabular-nums; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="page">
    <header>
      <span>madarion.io</span>
      <span>Personal site</span>
    </header>
    <main>
      <h1 id="name" aria-label="madarion.io">madarion.io</h1>
      <dl>
        <dt>Status</dt>
        <dd><span class="pulse" aria-hidden="true"></span>In progress</dd>
        <dt>Contact</dt>
        <dd><a href="mailto:hello@madarion.io">hello@madarion.io</a></dd>
      </dl>
    </main>
    <footer>
      <span>&copy; <span id="y">2026</span></span>
      <span class="clock" id="clock"></span>
      <span>v0.2</span>
    </footer>
  </div>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    // Split the name into letters for the staggered reveal
    const name = document.getElementById('name');
    name.innerHTML = [...name.textContent]
      .map((c, i) => `<span class="ch" aria-hidden="true" style="--i:${i}">${c}</span>`)
      .join('');

    // Visitor's local time
    const clock = document.getElementById('clock');
    const tick = () => {
      clock.textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
    };
    tick();
    setInterval(tick, 1000);

    // Dot field: slow ambient wave, dots swell and part around the pointer
    (() => {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const GAP = 26, RADIUS = 170, PUSH = 12;
      let w, h, dpr, color;
      const ptr = { x: -1e4, y: -1e4, tx: -1e4, ty: -1e4, s: 0, ts: 0 };

      const readColor = () => {
        color = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
      };
      const resize = () => {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (reduced) draw(0);
      };

      function draw(t) {
        ptr.x += (ptr.tx - ptr.x) * 0.12;
        ptr.y += (ptr.ty - ptr.y) * 0.12;
        ptr.s += (ptr.ts - ptr.s) * 0.06;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = color;
        const ox = (w % GAP) / 2, oy = (h % GAP) / 2;
        for (let y = oy; y <= h; y += GAP) {
          for (let x = ox; x <= w; x += GAP) {
            const dx = x - ptr.x, dy = y - ptr.y;
            const d = Math.hypot(dx, dy);
            let f = d < RADIUS ? 1 - d / RADIUS : 0;
            f = f * f * ptr.s;
            const wave = reduced ? 0 : Math.sin(x * 0.012 + y * 0.009 - t * 0.0009);
            const px = d ? x + (dx / d) * f * PUSH : x;
            const py = d ? y + (dy / d) * f * PUSH : y;
            const size = 1.4 + f * 3;
            ctx.globalAlpha = 0.14 + wave * 0.07 + f * 0.7;
            ctx.fillRect(px - size / 2, py - size / 2, size, size);
          }
        }
        if (!reduced) requestAnimationFrame(draw);
      }

      addEventListener('pointermove', e => {
        ptr.tx = e.clientX; ptr.ty = e.clientY; ptr.ts = 1;
        // Jump instead of sweeping across the screen when the pointer re-enters
        if (ptr.s < 0.02) { ptr.x = ptr.tx; ptr.y = ptr.ty; }
      });
      document.addEventListener('pointerleave', () => { ptr.ts = 0; });
      addEventListener('blur', () => { ptr.ts = 0; });
      addEventListener('resize', resize);
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColor(); if (reduced) draw(0); });

      readColor();
      resize();
      if (!reduced) requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
