<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>madarion.io</title>
  <meta name="description" content="madarion.io">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Plex Sans";
      src: url("/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Plex Sans";
      src: url("/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Plex Mono";
      src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #737373;
      --line: #e8e8e8;
      --sans: "Plex Sans", system-ui, sans-serif;
      --mono: "Plex Mono", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0c;
        --fg: #f2f2f2;
        --muted: #8c8c8c;
        --line: #232323;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 40px);
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-weight: 500;
      font-size: clamp(48px, 11vw, 168px);
      line-height: 1;
      letter-spacing: -0.045em;
      margin-left: -0.05em;
    }

    dl {
      display: grid;
      grid-template-columns: 96px 1fr;
      row-gap: 10px;
      margin-top: clamp(24px, 5vh, 56px);
      padding-top: 16px;
      border-top: 1px solid var(--line);
      max-width: 480px;
      font-size: 15px;
    }

    dt {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 22px;
      color: var(--muted);
    }

    dd { line-height: 22px; }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 4px;
      transition: text-decoration-color 0.15s;
    }
    a:hover { text-decoration-color: currentColor; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span>madarion.io</span>
      <span>Personal site</span>
    </header>
    <main>
      <h1>madarion.io</h1>
      <dl>
        <dt>Status</dt>
        <dd>In progress</dd>
        <dt>Contact</dt>
        <dd><a href="mailto:hello@madarion.io">hello@madarion.io</a></dd>
      </dl>
    </main>
    <footer>
      <span>&copy; <span id="y">2026</span></span>
      <span>v0.1</span>
    </footer>
  </div>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
